databases:
  - name: apex-db
    plan: starter
    databaseName: apex_prod
    user: apex

services:
  - name: apex-api
    plan: starter
    type: web
    runtime: node
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: apex-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
